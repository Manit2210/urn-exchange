# Smoke test: ONE cheap paid match to check your keys and routing before the full run.
#
# Three of the cheaper v1 models at a three-seat table, one pilot deal (pilot-01, clean draws, 10 hands,
# 20 moves per seat), first seat rotation only. Estimated cost about USD 0.70 (worst case about USD 11 if
# no prompt were cached and every reply hit the 16k limit); `urn-exchange dry-run --config configs/smoke.yaml`
# prints the estimate.
# A single rotation is not a complete duplicate deal, so it is not rated; use it to check that calls,
# tool use, reasoning echo and cost accounting work.
#
#   urn-exchange run --config configs/smoke.yaml
name: urn-exchange-smoke

budget_usd: 0     # set to e.g. 3 to allow the run (hard ceiling for this run id)

concurrency: 1
circuit_breaker: 1
params:
  max_tokens: 16000
  reasoning_effort: high
estimate_output_tokens: 3000
ledger: results/spend.sqlite
results_dir: results/runs
cache_dir: results/cache

models:
- key: gpt-6.2-sol
  provider: openai_compatible
  model: openai/gpt-6.2-sol
  api_key_env: OPENROUTER_API_KEY
  routing: {order: [openai], allow_fallbacks: false}
  rpm: 18
  estimate: {input_tokens_per_call: 6558, cached_fraction: 0.793, output_tokens_per_call: 390}
- key: gemini-4-argon
  provider: openai_compatible
  model: google/gemini-4-argon
  api_key_env: OPENROUTER_API_KEY
  routing: {order: [google-ai-studio], allow_fallbacks: false}
  rpm: 18
  params:
    reasoning: {max_tokens: 8000}
  estimate: {input_tokens_per_call: 14374, cached_fraction: 0.634, output_tokens_per_call: 951}
- key: claude-sonnet-5.5
  provider: openai_compatible
  model: anthropic/claude-sonnet-5.5
  api_key_env: OPENROUTER_API_KEY
  routing: {order: [anthropic], allow_fallbacks: false}
  rpm: 18
  params:
    cache_control: {type: ephemeral}
  estimate: {input_tokens_per_call: 7278, cached_fraction: 0.744, output_tokens_per_call: 228}

games:
- game: exchange
  deals: [pilot-01]
  seeds: [0]
  n_players: 3
  rotations: 1
